# 7조 DeepLog-Guard 공통 설정
# 모든 경로는 프로젝트 루트 기준 상대경로

seed: 42

paths:
  download_dir: data/raw/_download      # 원본 zip 보관
  raw_dir: data/raw/HDFS_v1             # 압축 해제된 원본 (HDFS.log, preprocessed/)
  interim_dir: data/interim             # Drain 파싱 결과 (라인/세션/템플릿)
  processed_dir: data/processed         # train/val/test 분할 결과
  artifacts_dir: artifacts              # Drain3 상태, 학습된 모델 등
  results_dir: results                  # 평가 결과 (json/csv)

dataset:
  name: HDFS_v1
  url: https://zenodo.org/records/8196385/files/HDFS_v1.zip?download=1
  zip_name: HDFS_v1.zip
  log_file: HDFS.log
  label_file: preprocessed/anomaly_label.csv

parsing:
  drain_config: configs/drain3.ini
  progress_every: 500000

split:
  # random: Block ID 단위 층화 무작위 분할 (테스트셋 실제 클래스 분포 유지)
  # chrono: 블록 최초 등장 순서 기준 시간순 분할
  strategy: random
  ratios: {train: 0.6, val: 0.2, test: 0.2}
  # 학습셋은 정상 세션만 사용 (이상 세션은 제외하고 개수만 기록)
  train_normal_only: true

window:
  size: 10        # 계획서: 10~20 범위에서 튜닝
  stride: 1

baseline:
  # 템플릿 텍스트에 포함되면 '오류 이벤트'로 간주하는 키워드 (대소문자 무시)
  # 주의: "invalid" 는 정상 이벤트 "invalidSet"(블록 삭제)에 매칭되어 제외
  keywords: [error, fail, exception, interrupt, timeout, refused, unable, cannot, corrupt]
  # 해당 레벨로 한 번이라도 찍힌 템플릿은 '오류 이벤트'로 간주
  error_levels: [WARN, ERROR, FATAL]
  # 빈도 임계치 후보 (정상 학습 세션 분포의 백분위수) → 검증셋 F1 최대값으로 선택
  # 5단계: 모델과 같은 세분화 그리드 사용 (공정 비교)
  percentile_grid: [99.0, 99.05, 99.1, 99.15, 99.2, 99.25, 99.3, 99.35, 99.4, 99.45, 99.5, 99.55, 99.6, 99.65, 99.7, 99.75, 99.8, 99.85, 99.9, 99.95, 99.99, 100.0]

# 모델 공통: 임계치 = val 정상 세션 점수의 백분위수 후보 (val F1 최대로 선택)
threshold:
  # 5단계: 99.0~99.95 를 0.05 간격으로 세분화 (기존 99.5 -> 99.9 사이 점프가 시드 편차의 원인)
  percentile_grid: [99.0, 99.05, 99.1, 99.15, 99.2, 99.25, 99.3, 99.35, 99.4, 99.45, 99.5, 99.55, 99.6, 99.65, 99.7, 99.75, 99.8, 99.85, 99.9, 99.95, 99.99, 100.0]

deeplog:
  window_size: 20         # 5단계 튜닝 결과 (results/tuning_deeplog_summary.csv): w=20, hidden 128 이 시드 3개 평균 최고
  add_eos: true           # 세션 끝 EOS 토큰 (EDA 결론 #4)
  embed_dim: 16
  hidden_size: 128        # 논문 기본 64 보다 128 이 평균 val F1 높음 (0.915 -> 0.927)
  num_layers: 2
  epochs: 20
  batch_size: 512
  lr: 0.002
  weight_power: 1.0       # 1: 원본 윈도우 분포 그대로, 0: 고유 윈도우 균등
  lr_schedule: none       # cosine 은 20 에폭에서 학습 부족 (시드 3개 평균 val F1 0.864 < 0.900)
  topk_grid: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  device: cpu             # 모델이 작아 CPU 가 더 빠를 수 있음 (auto 로 MPS 사용 가능)

autoencoder:
  window_size: 20         # 5단계 튜닝 결과 (results/tuning_autoencoder_summary.csv): w=20, 잠재 32 가 시드 3개 평균 최고
  add_eos: true
  hidden_dims: [64, 32]   # 440 -> 64 -> 32(잠재) -> 64 -> 440
  epochs: 300             # 30 에폭 F1 0.747 -> 300 에폭 0.94 (CPU 약 20초)
  batch_size: 512
  lr: 0.002
  lr_schedule: cosine     # 고정 학습률은 후반 loss 튐. 시드 3개 평균 val F1 0.916 -> 0.927
  weight_power: 1.0
  device: cpu

# 5단계 튜닝 그리드 (python -m logguard.models.tune --model <name>)
tuning:
  seeds: [42, 43, 44]
  deeplog:
    window_size: [10, 15, 20]
    hidden_size: [64, 128]
  autoencoder:
    window_size: [10, 15, 20]
    hidden_dims: [[64, 16], [64, 32]]

dashboard:
  database_path: artifacts/api/logguard.sqlite   # 백엔드 configs/api.yaml 의 database 와 같은 파일 (2026-10-20 통일)
  refresh_seconds: 5
  max_rows: 20000
  default_period_minutes: 60
