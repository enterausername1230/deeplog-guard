[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logguard"
version = "0.1.0"
description = "7조 - AI 기반 실시간 서버 로그 이상 탐지 및 알림 시스템 (DeepLog-Guard)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
